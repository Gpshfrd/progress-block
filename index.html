<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progress Block</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="progress.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
        <div class="demo">
            <h1 class="title">Progress</h1>
            <div class="preview">
                <svg
                    class="ring"
                    viewBox="0 0 120 120"
                    role="progressbar"
                    aria-label="Прогресс выполнения"
                    aria-valuemin="0"
                    aria-valuemax="100"
                >
                <circle class="ring-track" cx="60" cy="60" r="54" />
                <circle class="ring-progress" cx="60" cy="60" r="54" pathLength="100" />
                </svg>
            </div>

            <div class="controls">
                <label class="control">
                    <input id="value" type="number" min="0" max="100" value="65" aria-describedby="value-error" />
                    <span class="label">Value</span>
                </label>
                <p id="value-error" class="error" aria-live="polite"></p>
                
                <label class="control">
                    <input id="animate" type="checkbox" role="switch"/>
                    <span class="label">Animate</span>
                </label>

                <label class="control">
                    <input id="hide" type="checkbox" role="switch"/>
                    <span class="label">Hide</span>
                </label>
            </div>
        </div>
    </main>
  </body>
</html>
